name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          else
            BASE_SHA="$EVENT_BEFORE"
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files
          if grep -Eq '^(src/server/|src/shared/|migrations/|wrangler\.jsonc|package(-lock)?\.json|tsconfig.*|scripts/)' /tmp/changed-files; then echo 'backend=true' >> "$GITHUB_OUTPUT"; else echo 'backend=false' >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^(src/client/|src/frontend/|src/server/frontend\.ts$|src/shared/|public/|index\.html|vite\.config\.ts|wrangler\.frontend\.jsonc|package(-lock)?\.json|scripts/i18n/)' /tmp/changed-files; then echo 'frontend=true' >> "$GITHUB_OUTPUT"; else echo 'frontend=false' >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^gateway/' /tmp/changed-files; then echo 'gateway=true' >> "$GITHUB_OUTPUT"; else echo 'gateway=false' >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^migrations/' /tmp/changed-files; then echo 'migrations=true' >> "$GITHUB_OUTPUT"; else echo 'migrations=false' >> "$GITHUB_OUTPUT"; fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run cf:types -- --check
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run build:gateway
      - run: npm run check:deployment-parity
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.gateway == 'true')
    needs: [changes, verify]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check Cloudflare deploy credential
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::warning::Production deployment skipped: add an active CLOUDFLARE_API_TOKEN to the production environment."
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.available == 'true' && needs.changes.outputs.migrations == 'true'
        run: npm run db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.credentials.outputs.available == 'true' && needs.changes.outputs.backend == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.credentials.outputs.available == 'true' && needs.changes.outputs.frontend == 'true'
        run: npm run build && npx wrangler deploy --config wrangler.frontend.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.credentials.outputs.available == 'true' && needs.changes.outputs.gateway == 'true'
        run: npm run build:gateway && npx wrangler pages deploy --cwd gateway public --project-name saladfinder --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.credentials.outputs.available == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        run: |
          curl --fail --retry 3 https://saladfinder.com/
          curl --fail --retry 3 https://saladfinder.com/api/health
          curl --fail --retry 3 https://www.saladfinder.com/api/health
